[package]
name = "diary"
version = "0.1.0"
edition = "2024"

[dependencies]
# The shared core, in its own repository checked out next to this one.
tideline-core = { path = "../tideline-core" }
base64 = "0.23.1"
chrono = "0.4.45"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["datepicker"] }
genpdf = { version = "0.2.0", features = ["images"] }
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
jiff = "0.2.38"
lopdf = "0.26"
pulldown-cmark = "0.13.4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", default-features = false }

# Key derivation (Argon2) is far too slow unoptimised, so optimise dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
winresource = "0.1.31"

[[bin]]
name = "tideline-journal"
path = "src/main.rs"
